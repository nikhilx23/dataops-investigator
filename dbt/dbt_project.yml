name: dataops
version: "0.1.0"
config-version: 2
profile: dataops

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Incremental facts re-process keys whose source version changed within this window,
  # so late updates replace earlier rows instead of being missed or duplicated.
  incremental_lookback_days: 3

flags:
  send_anonymous_usage_stats: false

models:
  dataops:
    +persist_docs: {relation: true, columns: true}
    # Staging and intermediate are tables, not views: as views over the generic JSONB landing
    # table (DISTINCT ON per key) the planner badly underestimated their row counts, and a
    # join of two such views took over 20 minutes at the medium profile (benchmarks.md).
    staging:
      +schema: staging
      +materialized: table
      +post-hook: "analyze {{ this }}"
    intermediate:
      +schema: intermediate
      +materialized: table
      +post-hook: "analyze {{ this }}"
    marts:
      +schema: marts
      +materialized: table
