version: 2

models:
  - name: mart_daily_revenue
    description: >
      Daily revenue for the synthetic commerce company. Grain: one row per UTC date.
      booked_revenue_cents is attributed to the order date; captured/refunded/net to the
      payment and refund event dates. All amounts in USD cents.
    meta:
      owner: analytics-engineering
      grain: revenue_date
      dashboards: [revenue_overview]
    columns:
      - name: revenue_date
        data_tests: [unique, not_null]
      - name: booked_revenue_cents
        data_tests: [not_null]
      - name: net_collected_cents
        data_tests: [not_null]

  - name: mart_order_fulfillment
    meta: {owner: operations-analytics, grain: order, dashboards: [fulfillment_overview]}
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: mart_inventory_position
    meta: {owner: supply-chain-analytics, grain: product x warehouse, dashboards: [inventory_overview]}
    data_tests:
      - unique_combination:
          arguments: {columns: [product_id, warehouse_id]}

  - name: mart_payment_reconciliation
    meta: {owner: finance-analytics, grain: order, dashboards: [finance_reconciliation]}
    columns:
      - name: order_id
        data_tests: [unique, not_null]
