version: 2

models:
  - name: stg_orders
    description: Current version of each order from committed raw batches.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'paid', 'shipped', 'delivered', 'cancelled', 'refunded']
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD']
      - name: placed_at
        data_tests: [not_null]

  - name: stg_order_items
    description: Current version of each order line from committed raw batches.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: quantity
        data_tests: [not_null]
      - name: line_amount_cents
        data_tests: [not_null]

  - name: stg_payments
    description: Current version of each payment attempt from committed raw batches.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'succeeded', 'failed', 'refunded']
      - name: amount_cents
        data_tests: [not_null]

  - name: stg_refunds
    description: Current version of each refund from committed raw batches.
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: payment_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payments')
                field: payment_id
      - name: amount_cents
        data_tests: [not_null]
