name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dbt,dev,app]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Unit tests
        run: pytest tests/unit -q
      - name: dbt parse (no database needed)
        env:
          DATAOPS_WH_TRANSFORM_PASSWORD: parse-only-not-a-secret
        run: dbt parse --project-dir dbt --profiles-dir dbt

  integration:
    # Real PostgreSQL + pgvector; runs the Milestone 1 vertical slice and the M1 demo script.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: ci-admin-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dbt,dev,app]"
      - name: Install psql client (>= 15 for \getenv)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client
      - name: Generate throwaway CI credentials
        run: |
          python scripts/init_env.py
          sed -i 's/^DATAOPS_PG_ADMIN_PASSWORD=.*/DATAOPS_PG_ADMIN_PASSWORD=ci-admin-password/' .env
      - name: Bootstrap databases and roles
        run: bash scripts/bootstrap_db.sh
      - name: Integration tests
        run: pytest tests/integration -q
      - name: Milestone 1 demo
        run: bash scripts/demo_m1.sh
      - name: Investigator evaluation, fixture mode (labelled harness, not AI)
        run: python -m dataops eval --mode fixture

  spark-and-dags:
    # Contract validation on local Spark (jars from Maven Central) and Airflow DAG parsing.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dbt,full,dev]"
      - name: Spark validation tests
        run: pytest tests/spark -q
      - name: Airflow DAGs import cleanly (throwaway SQLite metadata)
        env:
          AIRFLOW_HOME: /tmp/afhome
          AIRFLOW__CORE__DAGS_FOLDER: orchestration/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: |
          python -m venv /tmp/af
          /tmp/af/bin/pip install "apache-airflow[postgres]==3.3.2" \
            -c orchestration/constraints-airflow-3.3.2-py3.13.txt
          /tmp/af/bin/airflow db migrate
          /tmp/af/bin/airflow dags reserialize
          test "$(/tmp/af/bin/airflow dags list -o plain | grep -c '^dataops_')" -eq 7
          /tmp/af/bin/airflow dags list-import-errors | tee /tmp/import-errors.txt
          grep -q "No data found" /tmp/import-errors.txt

  compose-and-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Compose config validates
        run: |
          python3 scripts/init_env.py
          docker compose --profile lightweight config --quiet
          docker compose --profile full config --quiet
      - name: Build app image
        run: docker build -f infra/docker/app.Dockerfile -t dataops-investigator/app:ci .
      - name: Shellcheck
        run: shellcheck -x scripts/*.sh infra/postgres/init/*.sh
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | Out-String | Write-Host }
          }
          exit $bad

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
