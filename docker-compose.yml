# DataOps Investigator - local synthetic environment.
#
# Profiles:
#   lightweight : PostgreSQL (source, warehouse, reliability) + app (CLI, ingestion, dbt).
#   full        : adds Kafka (KRaft) and Debezium Kafka Connect for change data capture.
#                 Spark runs as a Python process (see docs/full_profile.md); Airflow and
#                 monitoring are added here only once they are implemented and verified.
#
# All ports bind to 127.0.0.1. Credentials come from .env (python scripts/init_env.py).
# Measured memory use per service: docs/full_profile.md.
name: dataops-investigator

x-dataops-env: &dataops-env
  DATAOPS_PG_HOST: postgres
  DATAOPS_PG_PORT: "5432"
  DATAOPS_PG_ADMIN_USER: ${DATAOPS_PG_ADMIN_USER:-postgres}
  DATAOPS_PG_ADMIN_PASSWORD: ${DATAOPS_PG_ADMIN_PASSWORD:?run scripts/init_env.py}
  DATAOPS_SOURCE_DB: ${DATAOPS_SOURCE_DB:-commerce_source}
  DATAOPS_WAREHOUSE_DB: ${DATAOPS_WAREHOUSE_DB:-warehouse}
  DATAOPS_RELIABILITY_DB: ${DATAOPS_RELIABILITY_DB:-reliability}
  DATAOPS_AIRFLOW_DB: ${DATAOPS_AIRFLOW_DB:-airflow}
  DATAOPS_SRC_APP_PASSWORD: ${DATAOPS_SRC_APP_PASSWORD:?}
  DATAOPS_SRC_READER_PASSWORD: ${DATAOPS_SRC_READER_PASSWORD:?}
  DATAOPS_CDC_PASSWORD: ${DATAOPS_CDC_PASSWORD:?run scripts/init_env.py --force or add it}
  DATAOPS_WH_LOADER_PASSWORD: ${DATAOPS_WH_LOADER_PASSWORD:?}
  DATAOPS_WH_TRANSFORM_PASSWORD: ${DATAOPS_WH_TRANSFORM_PASSWORD:?}
  DATAOPS_WH_READER_PASSWORD: ${DATAOPS_WH_READER_PASSWORD:?}
  DATAOPS_REL_APP_PASSWORD: ${DATAOPS_REL_APP_PASSWORD:?}
  DATAOPS_REL_READER_PASSWORD: ${DATAOPS_REL_READER_PASSWORD:?}
  DATAOPS_AIRFLOW_DB_PASSWORD: ${DATAOPS_AIRFLOW_DB_PASSWORD:?}

services:
  postgres:
    profiles: ["lightweight", "full"]
    image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    # Logical WAL for Debezium. max_slot_wal_keep_size caps how much WAL an abandoned
    # replication slot can pin (development-safe: the slot is invalidated instead of the
    # disk filling up; the connector then needs a new snapshot).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=1024MB
    environment:
      <<: *dataops-env
      POSTGRES_USER: ${DATAOPS_PG_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DATAOPS_PG_ADMIN_PASSWORD:?run scripts/init_env.py}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${DATAOPS_PG_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    profiles: ["lightweight", "full"]
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    image: dataops-investigator/app:0.1.0
    environment: *dataops-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appvar:/app/var
    # One-shot CLI container: `docker compose run --rm app <command>`.
    command: ["health"]
    restart: "no"

  kafka:
    profiles: ["full"]
    # Debezium's Kafka 3.9.0 build, from Quay (no Docker Hub pull limits), KRaft mode.
    image: quay.io/debezium/kafka:3.0.8.Final@sha256:a5a886220f68c178e6b534679d1e679d12b0476b15aea43f748015727d2257a7
    environment:
      CLUSTER_ID: 5Yr1SIgYQz-b-dgRabWx4g
      NODE_ID: 1
      NODE_ROLE: combined
      HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Retain raw CDC/event history long enough for replay and backfill in the demo.
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafkadata:/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
    restart: unless-stopped

  connect:
    profiles: ["full"]
    image: quay.io/debezium/connect:3.0.8.Final@sha256:15bf1198757acca522d3e498decbbf7a3a1e20cbf353750fdc28fe18fec4b39d
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      # Debezium topics are created by the connector (topic.creation.* in its config).
      GROUP_ID: dataops-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx768m
      # Connector configs reference ${env:DATAOPS_CDC_PASSWORD}; the secret never enters the
      # connector config stored in Kafka or returned by the REST API.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DATAOPS_CDC_PASSWORD: ${DATAOPS_CDC_PASSWORD:?}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
  appvar:
  kafkadata:
