[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-investigator"
version = "0.1.0"
description = "AI data reliability platform with pipeline impact analysis and evidence-based incident investigation (synthetic demo environment)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
# Runtime pins: resolved against PyPI metadata on 2026-10-25 (see docs/versions.md).
dependencies = [
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dbt = [
  "dbt-core==1.12.6",
  "dbt-postgres==1.11.0",
]
full = [
  "pyspark==4.2.0",
  "delta-spark==4.4.1",
  "confluent-kafka==2.16.0",
  "httpx==0.28.1",
]
ai = [
  "anthropic==2.3.0",
]
app = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "streamlit==1.66.1",
  "prometheus-client==0.26.0",
  "httpx==0.28.1",
]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "types-PyYAML",
]

[project.scripts]
dataops = "dataops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires running PostgreSQL configured via DATAOPS_* environment variables",
  "spark: requires Java 17/21 and the full extra (Spark/Delta jars resolved from Maven Central)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311"]  # asserts in tests; random is used for deterministic synthetic data, not security

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B905"]
"scripts/**" = ["S603", "S607"]  # fixed, trusted commands (dbt, psql)
"src/dataops/evaluation/environment.py" = ["S603", "S607"]  # fixed dbt/psql invocations

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["dataops"]
mypy_path = "src"

[tool.setuptools.package-data]
dataops = ["migrations/*/*.sql"]
